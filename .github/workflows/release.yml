name: Release

# python-semantic-release job-based setup per the official UV integration guide
# (https://python-semantic-release.readthedocs.io/en/latest/configuration/configuration-guides/uv_integration.html)
# Release only after a successful CI run of the same commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  build:
    name: Build next version artifacts
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: none
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - name: API discipline | griffe check against last tag (§6)
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            uv run griffe check emuctl -s "git:$PREV_TAG" -s src
          else
            echo "no previous tag yet; skipping griffe API-diff check"
          fi
      - name: Stamp next version (no commit/tag/changelog; runs build_command → uv lock + uv build)
        id: version
        run: uv run semantic-release -v version --no-changelog --no-commit --no-tag
      - name: Upload distribution artifacts
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 2
      - name: Upload refreshed lock file
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uv.lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 2

  release:
    name: Create release commit + tag
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.released == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - run: git reset --hard ${{ github.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: uv.lock
          path: .
      - name: Stage refreshed lock file for the version commit
        run: git add uv.lock
      - name: Publish release (commit + tag + changelog)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release -v --strict version --skip-build
          uv run semantic-release publish

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/emuctl/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          verbose: true
