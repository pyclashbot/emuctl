[project]
name = "emuctl"
version = "0.1.0"
description = "A higher-level, vendor-agnostic Android emulator controller library."
readme = "README.md"
authors = [{ name = "Martin Miglio", email = "martin@pyclashbot.app" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["adb", "android", "device-automation"]
dependencies = ["anyio>=4.10"]

[project.urls]
Repository = "https://github.com/pyclashbot/emuctl"
Contract = "https://github.com/pyclashbot/emuctl/blob/main/CONTRACT.md"

[project.optional-dependencies]
cli = ["click>=8.2"]
google-play = []
bluestacks = []
all = ["click>=8.2"]

[dependency-groups]
dev = ["pytest>=8", "import-linter>=2.15", "pre-commit>=4"]
lint = ["ruff>=0.14", "ty>=0.0", "commitizen>=4"]
release = ["python-semantic-release>=10", "griffe>=1"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emuctl"

[tool.importlinter]
root_package = "emuctl"

# CONTRACT §6, expressed in import-linter 2.x: `forbidden` cannot express this rule —
# its forbidden_modules don't accept subpackages of the root ("django, not django.db.models"),
# which silently no-ops (caught by the guardrail smoke test). The `layers` contract with a
# container natively supports the nesting, and `exhaustive=true` breaks whenever a module
# exists that isn't in a declared layer — closing the enumeration hole.
[[tool.importlinter.contracts]]
name = "Backends may import core; core may never import backends"
type = "layers"
containers = ["emuctl"]
layers = [
  "backends",
  # `:` = one non-independent core tier (timing→errors→waits…); `|` would forbid intra-core imports.
  "config : log : png : port : errors : timing : waits : _proc : _serials : _identification : _sync : _discovery : _platforms : _adb",
]
exhaustive = true
# CONTRACT §3/§6 sanctioned seam: connect()/discover() live in core _discovery but
# selection/loading live in backends._registry, reached ONLY through function-local
# imports (never top-level in core). Dynamic ADAPTER imports stay exclusively in
# load_adapter (§7.10); this carve-out names the registry edge only, and
# unmatched-expression alerting fails the contract if the edge ever disappears.
ignore_imports = [
  "emuctl._discovery -> emuctl.backends._registry",
  # Same sanctioned seam as above: connect_sync is §5's sync twin of connect()
  # and reaches the registry through the identical function-local import.
  "emuctl._sync -> emuctl.backends._registry",
]

[[tool.importlinter.contracts]]
name = "Backend families are independent"
type = "independence"
include_external_packages = false
modules = ["emuctl.backends.adb", "emuctl.backends.bluestacks", "emuctl.backends.google_play"]

[tool.ruff]
line-length = 112
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T20", "TID", "S"]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "GO through emuctl._proc.run_process; direct subprocess use is banned outside _proc.py."

[tool.ruff.lint.per-file-ignores]
# the single sanctioned subprocess import point (TID251 exemption is file-wide — keep banned-api single-entry)
"src/emuctl/_proc.py" = ["TID251"]
"tests/**" = ["TID251", "S602", "S603", "S607", "T201"]

[tool.ty.src]
include = ["src", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
# PSR 10.x uses "v{version}" (the commitizen "$version" form fails validation).
tag_format = "v{version}"
# Keep v0.x releases legal for the first release.
allow_zero_version = true
commit_author = "github-actions[bot] <actions@github.com>"
# UV recipe (PSR docs: configuration-guides/uv_integration): refresh the lock for the new
# version, stage it into the release commit, then build. uv is on PATH via setup-uv in CI.
build_command = """
  uv lock --upgrade-package "$PACKAGE_NAME"
  git add uv.lock
  uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
