[project]
name = "emuctl"
version = "0.1.0"
description = "A higher-level, vendor-agnostic Android emulator controller library."
readme = "README.md"
authors = [{ name = "Martin Miglio", email = "martin@pyclashbot.app" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["adb", "android-emulator", "memu", "bluestacks", "avd"]
dependencies = ["anyio>=4.10"]

[project.urls]
Repository = "https://github.com/pyclashbot/emuctl"
Contract = "https://github.com/pyclashbot/emuctl/blob/main/CONTRACT.md"

# §5: "Console script in the core distribution (pip ignores extras on entry
# points — pip#9726): a lazy-click stub exits 3 with 'install `emuctl[cli]`'".
# The script therefore points at the CLICK-FREE package root; emuctl/cli/__init__.py
# imports click lazily inside main()/amain(), so a core install without the
# extra still gets a clean exit 3 instead of a ModuleNotFoundError traceback.
[project.scripts]
emuctl = "emuctl.cli:main"

[project.optional-dependencies]
memu = ["pymemuc>=0.6,<0.7"]
bluestacks = []
google-play = []
avd = []
cli = ["click>=8.2"]
all = ["pymemuc>=0.6,<0.7", "click>=8.2"]

[dependency-groups]
# `click` is the [cli] extra's framework: the offline conformance suite drives
# the CLI through click.testing, so it belongs to the dev group explicitly
# rather than relying on a transitive dependency (commitizen happens to pull
# click today — that is an accident, not a contract). test_cli_failures.py's
# hermetic eviction test proves the library itself never needs it.
dev = ["pytest>=8", "import-linter>=2.15", "pre-commit>=4", "click>=8.2"]
lint = ["ruff>=0.14", "ty>=0.0", "commitizen>=4"]
release = ["python-semantic-release>=10", "griffe>=1"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emuctl"

[tool.importlinter]
root_package = "emuctl"

# CONTRACT §6, expressed in import-linter 2.x: `forbidden` cannot express this rule —
# its forbidden_modules don't accept subpackages of the root ("django, not django.db.models"),
# which silently no-ops (caught by the guardrail smoke test). The `layers` contract with a
# container natively supports the nesting, and `exhaustive=true` breaks whenever a module
# exists that isn't in a declared layer — closing the enumeration hole.
[[tool.importlinter.contracts]]
name = "Backends may import core; core may never import backends"
type = "layers"
containers = ["emuctl"]
layers = [
  # §5's optional Click CLI is the TOP layer: it may import the core tier and
  # the backend packages (through the same function-local registry seams
  # `connect()` uses — §6 rule 3), while nothing in core or the backends may
  # import it back. Note this makes the `cli` → `backends._registry` edge
  # contract-legal, so it needs no ignore_imports carve-out below.
  "cli",
  "backends",
  # `:` = one non-independent core tier (timing→errors→waits…); `|` would forbid intra-core imports.
  "config : log : png : port : errors : timing : waits : _proc : _serials : _identification : _sync : _discovery : _platforms",
]
# Exhaustiveness is what keeps this list honest: every module in the package
# must be declared in a layer, so a new module (cli/… included) that is not
# declared here fails the contract until it is.
exhaustive = true
# CONTRACT §3/§6 sanctioned seam: connect()/discover() live in core _discovery but
# selection/loading live in backends._registry, reached ONLY through function-local
# imports (never top-level in core). Dynamic ADAPTER imports stay exclusively in
# load_adapter (§7.10); this carve-out names the registry edge only, and
# unmatched-expression alerting fails the contract if the edge ever disappears.
# (The §5 CLI reaches the same spec table from the `cli` layer above, which the
# layers list already permits — no carve-out needed there.)
ignore_imports = [
  "emuctl._discovery -> emuctl.backends._registry",
  # Same sanctioned seam as above: connect_sync is §5's sync twin of connect()
  # and reaches the registry through the identical function-local import.
  "emuctl._sync -> emuctl.backends._registry",
]

[[tool.importlinter.contracts]]
name = "Backend families are independent"
type = "independence"
include_external_packages = false
modules = [
  "emuctl.backends.adb",
  "emuctl.backends.memu",
  "emuctl.backends.bluestacks",
  "emuctl.backends.google_play",
  "emuctl.backends.avd",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T20", "TID", "S"]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "GO through emuctl._proc.run_process; direct subprocess use is banned outside _proc.py."

[tool.ruff.lint.per-file-ignores]
# the single sanctioned subprocess import point (TID251 exemption is file-wide — keep banned-api single-entry)
"src/emuctl/_proc.py" = ["TID251"]
"tests/**" = ["TID251", "S602", "S603", "S607", "T201"]

[tool.ty.src]
include = ["src", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v$version"
commit_author = "github-actions[bot] <actions@github.com>"
# UV recipe (PSR docs: configuration-guides/uv_integration): refresh the lock for the new
# version, stage it into the release commit, then build. uv is on PATH via setup-uv in CI.
build_command = """
  uv lock --upgrade-package "$PACKAGE_NAME"
  git add uv.lock
  uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["emulator: hardware-attached tests, opt-in via -m emulator (not CI)"]
