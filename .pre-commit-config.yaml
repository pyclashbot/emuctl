# aligns with [tool.ruff]/[tool.importlinter]/[tool.commitizen] in pyproject.toml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|CONTRACT\.md|README\.md)
      - id: end-of-file-fixer
        exclude: ^(docs/|CONTRACT\.md|README\.md)
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (§6 layers + independence)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      # conventional-commit gate per §6; reads [tool.commitizen] from pyproject.toml
      - id: commitizen
        stages: [commit-msg]
